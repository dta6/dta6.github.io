<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

iframe {
    border: none;
    width: 100vw;
    height: 100vh;
}

@media (max-width: 900px) and (orientation: portrait) {
    iframe {
        position: absolute;
        top: 0;
        left: 100%;

        width: 100vh;
        height: 100vw;

        transform: rotate(90deg);
        transform-origin: top left;
    }
}
</style>
</head>
<body>

<iframe src="game.html"></iframe>

</body>
</html>
